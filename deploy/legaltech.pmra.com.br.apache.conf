# VirtualHost Apache do gerador de propostas PMRA — legaltech.pmra.com.br
# Testado para Apache 2.4.47+ (o servidor atual roda 2.4.68/Debian).
#
# Instalar:
#   sudo cp deploy/legaltech.pmra.com.br.apache.conf /etc/apache2/sites-available/legaltech.pmra.com.br.conf
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers ssl
#   sudo a2ensite legaltech.pmra.com.br
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# ATENCAO — o dominio JA tem um vhost 443 ativo (o que devolve 403 hoje).
# Liste com `sudo apache2ctl -S`, e:
#   - ou desative o antigo (sudo a2dissite <nome>) e use este arquivo,
#     copiando para ca as linhas SSLCertificate* do vhost antigo;
#   - ou cole o bloco "PROXY" abaixo dentro do vhost 443 existente.
#
# O `upgrade=websocket` no ProxyPass atende o WebSocket do Streamlit
# (rota /_stcore/stream). Sem isso o app carrega e congela em "Please wait...".

<VirtualHost *:80>
    ServerName legaltech.pmra.com.br

    # Tudo em HTTPS (o dominio ja serve 443)
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName legaltech.pmra.com.br

    SSLEngine on
    # Reaproveite o certificado do vhost atual (veja `sudo apache2ctl -S` e o
    # arquivo em /etc/apache2/sites-enabled/ que hoje responde o 403), ou emita
    # um novo com: sudo certbot --apache -d legaltech.pmra.com.br
    SSLCertificateFile      /etc/letsencrypt/live/legaltech.pmra.com.br/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/legaltech.pmra.com.br/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/legaltech.pmra.com.br.error.log
    CustomLog ${APACHE_LOG_DIR}/legaltech.pmra.com.br.access.log combined

    # ── PROXY para o Streamlit (127.0.0.1:8501, systemd pmra-propostas) ──────
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    # HTTP + WebSocket no mesmo backend (Apache >= 2.4.47)
    ProxyPass        / http://127.0.0.1:8501/ upgrade=websocket retry=1
    ProxyPassReverse / http://127.0.0.1:8501/

    # Sessoes Streamlit sao de longa duracao — nao derrubar o socket.
    ProxyTimeout 86400
    # ─────────────────────────────────────────────────────────────────────────

    # Health check p/ monitoramento: https://legaltech.pmra.com.br/_stcore/health -> "ok"
</VirtualHost>
